<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Turbo EverDrive — GAMES</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🕹️ GAMES</h1>
    <span id="status" class="status">…</span>
  </header>
  <main id="app">
    <p class="hint">Chargement…</p>
  </main>

  <!-- Fiche de détail d'un jeu (tap sur une vignette de la mosaïque) : sert
       aussi d'écran de confirmation avant lancement (bouton ▶ Lancer). -->
  <div class="modal-backdrop" id="detail-modal" hidden>
    <div class="modal-box detail-box">
      <button class="icon-btn close-btn" id="detail-close" title="Fermer">✕</button>
      <button class="icon-btn fav-btn" id="detail-fav" title="Ajouter aux favoris">♡</button>
      <div class="detail-boxart-wrap">
        <img id="detail-boxart" alt="" />
        <div class="detail-boxart-ph" id="detail-boxart-ph">🎮</div>
      </div>
      <h2 id="detail-title"></h2>
      <p class="detail-meta" id="detail-meta"></p>
      <div class="detail-snap-wrap" id="detail-snap-wrap" hidden>
        <img id="detail-snap" alt="" />
        <span class="detail-snap-label" id="detail-snap-label"></span>
      </div>
      <button class="btn primary detail-launch" id="detail-launch">▶ Lancer</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
