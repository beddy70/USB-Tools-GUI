[package]
name = "edlink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interface graphique (Tauri) pour la Turbo EverDrive"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
edlink-core = { path = "../edlink-core" }
# rustls (pas openssl/native-tls) : indispensable pour la cross-compilation
# Windows (x86_64-pc-windows-gnu) déjà utilisée par ce projet (voir README).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
percent-encoding = "2"
# Similarité de texte (recherche de pochette au plus proche quand aucune
# variante exacte ne correspond) — pure Rust, sans dépendance lourde.
strsim = "0.11"
# Serveur web mobile (onglet GAMES accessible depuis un smartphone sur le
# même réseau local) : serveur HTTP bloquant minimal, pur Rust, sans piste
# TLS (réseau local de confiance uniquement, pas d'HTTPS) ni runtime async
# supplémentaire.
tiny_http = { version = "0.12", default-features = false }
# QR code (adresse du serveur mobile) : on encode nous-mêmes la matrice en
# PNG via `png` (déjà utilisé par edlink-core/image.rs) plutôt que d'activer
# la feature "image" de `qrcode`, pour ne pas tirer la dépendance `image`
# (lourde, inutile ici).
qrcode = { version = "0.14", default-features = false }
png = "0.18"
