# Cross-compilation Windows (mingw-w64) depuis macOS / Linux.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# Cross-compilation Linux (musl, via messense/macos-cross-toolchains) depuis
# macOS — pour edlink-cli/edlink-emulator uniquement : edlink-app (Tauri) a
# besoin de webkit2gtk/GTK, une vraie machine Linux (ou un conteneur) pour
# builder, pas seulement un cross-linker.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-unknown-linux-musl-gcc"
ar = "x86_64-unknown-linux-musl-gcc-ar"
